<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="665" viewBox="0 0 1000 665" role="img" aria-labelledby="title description">
  <title id="title">AWS reference architecture for Devplan self-hosting</title>
  <desc id="description">Approved users reach a private-by-default Application Load Balancer in the customer VPC. Amazon EKS runs Devplan workloads; they connect to RDS PostgreSQL and S3. IAM Pod Identity and KMS with Secrets Manager support the deployment. External services are configuration-dependent.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101726"/>
      <stop offset="1" stop-color="#151F32"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#91A5C4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="optional-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#BAA7E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .eyebrow { fill: #A5B7FF; font-size: 11px; font-weight: 700; letter-spacing: 2.2px; }
    .diagram-title { fill: #F1F5FF; font-size: 25px; font-weight: 700; letter-spacing: -.5px; }
    .subtitle { fill: #B3C1D7; font-size: 13px; }
    .zone-label { fill: #B3C1D7; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .card-label { fill: #8FA2BD; font-size: 10px; font-weight: 700; letter-spacing: 1.7px; }
    .card-title { fill: #F1F5FF; font-size: 17px; font-weight: 700; }
    .card-copy { fill: #B3C1D7; font-size: 12px; }
    .chip-text { fill: #F1F5FF; font-size: 13px; font-weight: 600; }
    .flow { fill: none; stroke: #91A5C4; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .flow-optional { fill: none; stroke: #BAA7E8; stroke-width: 2.1; stroke-dasharray: 6 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#optional-arrow); }
  </style>
  <rect x="1" y="1" width="998" height="663" rx="20" fill="url(#canvas)" stroke="#30415D" stroke-width="2"/>
  <circle cx="920" cy="42" r="125" fill="#203863" opacity=".38"/>

  <text x="32" y="40" class="eyebrow">REFERENCE ARCHITECTURE  /  02</text>
  <text x="32" y="75" class="diagram-title">An AWS deployment example</text>
  <text x="32" y="99" class="subtitle">Provider-specific services implement the same workload and data boundaries.</text>

  <rect x="225" y="125" width="740" height="430" rx="18" fill="#17243A" stroke="#3C5376" stroke-width="1.7"/>
  <text x="250" y="153" class="zone-label">CUSTOMER AWS ACCOUNT</text>
  <rect x="250" y="183" width="500" height="334" rx="16" fill="#1C2B45" stroke="#5574A4" stroke-width="1.8"/>
  <text x="272" y="210" class="zone-label">CUSTOMER VPC</text>
  <rect x="440" y="217" width="281" height="222" rx="15" fill="#26375D" stroke="#5B75B5" stroke-width="1.7"/>
  <text x="461" y="244" class="zone-label">AMAZON EKS</text>

  <path d="M205 315 H275" class="flow"/>
  <path d="M420 315 H463" class="flow"/>
  <path d="M698 315 H770" class="flow"/>
  <path d="M580 417 V455" class="flow"/>
  <path d="M770 415 H739 V391 H698" class="flow-optional"/>
  <path d="M770 486 H735 V480 H698" class="flow-optional"/>
  <path d="M463 390 H430 V617 H440" class="flow-optional"/>

  <rect x="30" y="263" width="175" height="105" rx="15" fill="#192438" stroke="#30415D" stroke-width="1.6" filter="url(#card-shadow)"/>
  <rect x="48" y="281" width="4" height="28" rx="2" fill="#A5B7FF"/>
  <text x="62" y="292" class="card-label">ACCESS</text>
  <text x="48" y="328" class="card-title">Approved users</text>
  <text x="48" y="349" class="card-copy">Customer networks</text>

  <rect x="275" y="263" width="145" height="105" rx="15" fill="#26375D" stroke="#5B75B5" stroke-width="1.6"/>
  <rect x="292" y="281" width="4" height="28" rx="2" fill="#A5B7FF"/>
  <text x="307" y="292" class="card-label">INGRESS</text>
  <text x="292" y="328" class="card-title">AWS ALB</text>
  <text x="292" y="349" class="card-copy">Private by default</text>

  <rect x="463" y="267" width="235" height="150" rx="15" fill="#192438" stroke="#5B75B5" stroke-width="1.8" filter="url(#card-shadow)"/>
  <text x="482" y="291" class="card-label">APPLICATION</text>
  <text x="482" y="322" class="card-title">Devplan workloads</text>
  <line x1="482" y1="335" x2="679" y2="335" stroke="#5B75B5"/>
  <circle cx="488" cy="352" r="4" fill="#A5B7FF"/>
  <text x="501" y="357" class="chip-text">Application + AI agents</text>
  <circle cx="488" cy="376" r="4" fill="#A5B7FF"/>
  <text x="501" y="381" class="chip-text">Workflow processing</text>
  <circle cx="488" cy="400" r="4" fill="#A5B7FF"/>
  <text x="501" y="405" class="chip-text">Graph database</text>

  <rect x="463" y="455" width="235" height="48" rx="12" fill="#174442" stroke="#317E79" stroke-width="1.6"/>
  <text x="482" y="484" class="chip-text">RDS PostgreSQL</text>

  <rect x="770" y="263" width="170" height="105" rx="15" fill="#174442" stroke="#317E79" stroke-width="1.6"/>
  <rect x="787" y="281" width="4" height="28" rx="2" fill="#69DCCA"/>
  <text x="802" y="292" class="card-label">OBJECT STORAGE</text>
  <text x="787" y="328" class="card-title">Amazon S3</text>
  <text x="787" y="349" class="card-copy">Objects + artifacts</text>

  <rect x="770" y="389" width="170" height="52" rx="13" fill="#38305D" stroke="#7568AB" stroke-width="1.6"/>
  <text x="786" y="410" class="card-label">WORKLOAD IDENTITY</text>
  <text x="786" y="430" class="chip-text">IAM Pod Identity</text>

  <rect x="770" y="455" width="170" height="62" rx="13" fill="#38305D" stroke="#7568AB" stroke-width="1.6"/>
  <text x="786" y="475" class="card-label">DATA PROTECTION</text>
  <text x="786" y="495" class="chip-text">KMS + Secrets</text>
  <text x="786" y="511" class="chip-text">Manager</text>

  <rect x="440" y="590" width="281" height="55" rx="14" fill="#503B25" stroke="#967044" stroke-width="1.6"/>
  <text x="459" y="611" class="card-label">CONFIGURED EGRESS</text>
  <text x="459" y="634" class="chip-text">External integrations + services</text>

  <line x1="32" y1="617" x2="58" y2="617" stroke="#91A5C4" stroke-width="2.3"/>
  <text x="69" y="621" class="card-copy">Core flow</text>
  <line x1="145" y1="617" x2="171" y2="617" stroke="#BAA7E8" stroke-width="2.1" stroke-dasharray="6 5"/>
  <text x="182" y="621" class="card-copy">Configuration-dependent</text>

</svg>
