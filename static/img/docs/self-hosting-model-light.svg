<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title description">
  <title id="title">Provider-neutral Devplan self-hosting architecture</title>
  <desc id="description">Users reach Devplan workloads through customer-managed ingress. The application, AI agents, workflow processing, and graph database run in Kubernetes and use customer PostgreSQL and object storage. Configuration and secrets feed the workloads; configured external services sit outside the customer boundary.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#F1F5FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#8295B2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="optional-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#9A83C8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1D3156" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .eyebrow { fill: #3159DF; font-size: 11px; font-weight: 700; letter-spacing: 2.2px; }
    .diagram-title { fill: #18263D; font-size: 25px; font-weight: 700; letter-spacing: -.5px; }
    .subtitle { fill: #52647E; font-size: 13px; }
    .zone-label { fill: #52647E; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .card-label { fill: #73849C; font-size: 10px; font-weight: 700; letter-spacing: 1.7px; }
    .card-title { fill: #18263D; font-size: 17px; font-weight: 700; }
    .card-copy { fill: #52647E; font-size: 12px; }
    .chip-text { fill: #18263D; font-size: 13px; font-weight: 600; }
    .flow { fill: none; stroke: #8295B2; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .flow-optional { fill: none; stroke: #9A83C8; stroke-width: 2.1; stroke-dasharray: 6 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#optional-arrow); }
  </style>
  <rect x="1" y="1" width="998" height="608" rx="20" fill="url(#canvas)" stroke="#DCE5F4" stroke-width="2"/>
  <circle cx="920" cy="42" r="125" fill="#DDE7FF" opacity=".38"/>

  <text x="32" y="40" class="eyebrow">DEPLOYMENT MODEL  /  01</text>
  <text x="32" y="75" class="diagram-title">One customer-managed environment</text>
  <text x="32" y="99" class="subtitle">Devplan workloads run alongside customer-controlled data services.</text>

  <rect x="235" y="124" width="730" height="361" rx="18" fill="#F0F5FF" stroke="#C9D8F1" stroke-width="1.7"/>
  <text x="260" y="151" class="zone-label">CUSTOMER-MANAGED ENVIRONMENT</text>
  <rect x="430" y="178" width="276" height="222" rx="16" fill="#FFFFFF" stroke="#B9CDF1" stroke-width="1.8"/>
  <text x="451" y="204" class="zone-label">KUBERNETES CLUSTER</text>

  <path d="M205 290 H258" class="flow"/>
  <path d="M408 290 H451" class="flow"/>
  <path d="M684 263 H720 V260 H740" class="flow"/>
  <path d="M684 322 H718 V375 H740" class="flow"/>
  <path d="M408 402 H427 V344 H451" class="flow-optional"/>
  <path d="M569 365 V520" class="flow-optional"/>

  <rect x="30" y="240" width="175" height="100" rx="15" fill="#FFFFFF" stroke="#DCE5F4" stroke-width="1.6" filter="url(#card-shadow)"/>
  <rect x="48" y="258" width="4" height="28" rx="2" fill="#3159DF"/>
  <text x="62" y="269" class="card-label">ACCESS</text>
  <text x="48" y="307" class="card-title">Users</text>
  <text x="48" y="327" class="card-copy">Connected systems</text>

  <rect x="258" y="240" width="150" height="100" rx="15" fill="#EAF0FF" stroke="#B9CBFF" stroke-width="1.6"/>
  <rect x="275" y="258" width="4" height="28" rx="2" fill="#3159DF"/>
  <text x="290" y="269" class="card-label">NETWORK</text>
  <text x="275" y="307" class="card-title">Ingress</text>
  <text x="275" y="327" class="card-copy">Customer policies</text>

  <rect x="451" y="226" width="233" height="139" rx="15" fill="#EAF0FF" stroke="#B9CBFF" stroke-width="1.8" filter="url(#card-shadow)"/>
  <text x="470" y="249" class="card-label">APPLICATION</text>
  <text x="470" y="279" class="card-title">Devplan workloads</text>
  <line x1="470" y1="292" x2="665" y2="292" stroke="#B9CBFF"/>
  <circle cx="476" cy="307" r="4" fill="#3159DF"/>
  <text x="489" y="312" class="chip-text">Application + AI agents</text>
  <circle cx="476" cy="329" r="4" fill="#3159DF"/>
  <text x="489" y="334" class="chip-text">Workflow processing</text>
  <circle cx="476" cy="351" r="4" fill="#3159DF"/>
  <text x="489" y="356" class="chip-text">Graph database</text>

  <rect x="740" y="215" width="185" height="90" rx="15" fill="#E8F8F5" stroke="#B4E4DC" stroke-width="1.6"/>
  <rect x="757" y="233" width="4" height="26" rx="2" fill="#087E78"/>
  <text x="772" y="244" class="card-label">CUSTOMER DATA</text>
  <text x="757" y="278" class="card-title">PostgreSQL</text>
  <text x="757" y="296" class="card-copy">Application database</text>

  <rect x="740" y="330" width="185" height="90" rx="15" fill="#E8F8F5" stroke="#B4E4DC" stroke-width="1.6"/>
  <rect x="757" y="348" width="4" height="26" rx="2" fill="#087E78"/>
  <text x="772" y="359" class="card-label">CUSTOMER DATA</text>
  <text x="757" y="393" class="card-title">Object storage</text>
  <text x="757" y="411" class="card-copy">Objects + artifacts</text>

  <rect x="258" y="366" width="150" height="70" rx="14" fill="#F2EFFF" stroke="#D8D0FA" stroke-width="1.6"/>
  <text x="274" y="390" class="card-label">WORKLOAD INPUT</text>
  <text x="274" y="414" class="chip-text">Config + secrets</text>

  <rect x="430" y="520" width="276" height="60" rx="14" fill="#FFF5E7" stroke="#F0D7AE" stroke-width="1.6"/>
  <text x="449" y="542" class="card-label">WHERE CONFIGURED</text>
  <text x="449" y="565" class="chip-text">External integrations + services</text>

  <line x1="32" y1="556" x2="58" y2="556" stroke="#8295B2" stroke-width="2.3"/>
  <text x="69" y="560" class="card-copy">Core flow</text>
  <line x1="145" y1="556" x2="171" y2="556" stroke="#9A83C8" stroke-width="2.1" stroke-dasharray="6 5"/>
  <text x="182" y="560" class="card-copy">Configuration-dependent</text>

</svg>
